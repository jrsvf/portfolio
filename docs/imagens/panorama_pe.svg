<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="t d">
  <title id="t">Pernambuco do sertão ao mar</title>
  <desc id="d">Ilustração do estado de oeste a leste: o rio São Francisco com fruta irrigada e vinhedos, o sertão com mandacarus, a chapada do Araripe com o gesso, parques de vento e sol, o Agreste com gado, feira e confecção, a Zona da Mata com cana e a chaminé da usina, e o litoral com o Recife, o porto e o mar.</desc>
