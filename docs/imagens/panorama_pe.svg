    <pattern id="lote" width="26" height="14" patternUnits="userSpaceOnUse"><rect width="24" height="12" rx="2" fill="#8DB36F"/></pattern>
  </defs>
  <rect width="1400" height="360" fill="url(#ceu)"/>
