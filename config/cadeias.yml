# =============================================================================
# CADEIAS PRODUTIVAS ACOMPANHADAS PELO PORTFÓLIO
# =============================================================================
# Cada cadeia é dividida em ELOS. Cada elo é definido por códigos CNAE 2.0,
# sem hífen nem barra, em dois níveis possíveis:
#   classe    5 dígitos  (0155-5    -> "01555")
#   subclasse 7 dígitos  (0155-5/01 -> "0155501")
# Use subclasse quando a classe mistura atividades de cadeias diferentes
# (ex.: 1012-1 junta abate de aves e de suínos). O pipeline confere todos os
# códigos contra o diretório CNAE da Base dos Dados e para com erro claro se
# algum não existir.
#
# sh4:   posições do Sistema Harmonizado (4 dígitos) usadas no ComexStat.
#        Além das listadas, o pipeline inclui automaticamente as posições
#        ligadas às CLASSES (5 dígitos) da cadeia pela correspondência
#        NCM x CNAE do IBGE (config/sh4_cnae.csv). Para desligar, use
#        sh4_auto: false na cadeia.
# pim:   atividades da PIM-PF Regional (tabela SIDRA 8888) ligadas à cadeia,
#        pelo código da CNAE usado pelo IBGE (ex.: "3.29" = veículos). Só as
#        atividades que o IBGE divulga para PE aparecem no site.
# pmc/pms: atividades da Pesquisa Mensal de Comércio (tabela 8883) e de
#        Serviços (tabela 8693) ligadas à cadeia, pelo código da categoria no
#        SIDRA. "t8694" na PMS = atividades turísticas (tabela 8694).
# sidra: produtos/rebanhos do IBGE. `tabela` é a tabela SIDRA e `padrao` é uma
#        expressão regular aplicada ao NOME do produto (não ao código), para
#        não depender de códigos de categoria que mudam entre tabelas.
#          5457 = PAM (lavouras)            3939 = PPM efetivo dos rebanhos
#          74   = PPM produção origem animal 3940 = PPM aquicultura
#          289  = PEVS extração vegetal     291  = PEVS silvicultura
# nota:  ressalvas conhecidas de cobertura (aparecem na página de lacunas).
#
# Para incluir uma cadeia nova basta copiar um bloco, ajustar e rodar o
# pipeline. A página da cadeia é gerada automaticamente.
# =============================================================================

cadeias:

  - id: avicultura
    nome: Avicultura
    macrossetor: Agropecuária e agroindústria
    descricao: >
      Criação de aves de corte e postura, ração, abate e distribuição.
      Pernambuco tem um dos maiores plantéis de galinhas poedeiras do Nordeste,
      concentrado no Agreste.
    elos:
      - nome: Insumos (ração)
        cnae: ["10660"]
      - nome: Produção de frangos e pintos
        cnae: ["0155501", "0155502", "0155503", "0155504"]
      - nome: Produção de ovos
        cnae: ["0155505"]
      - nome: Abate e processamento
        cnae: ["1012101"]
      - nome: Distribuição
        cnae: ["4634602"]
    sh4: ["0105", "0207", "0208", "0407", "0408", "1601", "1602"]
    sh4_auto: false
    sidra:
      - {tabela: 3939, padrao: "Galin|Galo|Frango"}
      - {tabela: 74, padrao: "Ovos de galinha"}
    nota: >
      A ração (1066-0) atende também bovinos, suínos e aquicultura; o elo de
      insumos é, portanto, um teto.

