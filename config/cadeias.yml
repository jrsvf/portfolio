      - nome: Distribuição de carnes
        cnae: ["4634601"]
    sh4: ["0102", "0201", "0202", "0401", "0402", "0403", "0404", "0405", "0406", "4101", "4104"]
    sidra:
      - {tabela: 3939, padrao: "^Bovino"}
